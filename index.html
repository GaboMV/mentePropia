    <!-- Script interactivo -->
    <script>
        // Menú Móvil
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuIconOpen = document.getElementById('menu-icon-open');
        const menuIconClose = document.getElementById('menu-icon-close');
        const mobileLinks = document.querySelectorAll('.mobile-nav-link');

        let isMenuOpen = false;

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                mobileMenu.classList.add('opacity-100', 'pointer-events-auto');
                menuIconOpen.classList.add('hidden');
                menuIconClose.classList.remove('hidden');
                document.body.classList.add('overflow-hidden');
            } else {
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
                menuIconOpen.classList.remove('hidden');
                menuIconClose.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            }
        }

        menuToggle.addEventListener('click', toggleMenu);

        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (isMenuOpen) toggleMenu();
            });
        });

        // Control de Música de Fondo
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const musicIconOn = document.getElementById('music-icon-on');
        const musicIconOff = document.getElementById('music-icon-off');

        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
                updateAudioUI(false);
            } else {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    updateAudioUI(true);
                }).catch((error) => {
                    console.log("Reproducción bloqueada por el navegador:", error);
                });
            }
        }

        function updateAudioUI(playing) {
            if (playing) {
                // Estado Activado: Icono Blanco
                if (musicIconOn) musicIconOn.classList.remove('hidden');
                if (musicIconOff) musicIconOff.classList.add('hidden');
                if (musicToggle) {
                    musicToggle.className = "music-btn w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-white flex items-center justify-center text-white bg-white/25 hover:scale-105 active:scale-95 transition-all duration-300 focus:outline-none cursor-pointer shadow-md";
                }
            } else {
                // Estado Desactivado: Icono Negro
                if (musicIconOn) musicIconOn.classList.add('hidden');
                if (musicIconOff) musicIconOff.classList.remove('hidden');
                if (musicToggle) {
                    musicToggle.className = "music-btn w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-white/80 flex items-center justify-center text-black bg-white hover:scale-105 active:scale-95 transition-all duration-300 focus:outline-none cursor-pointer shadow-md";
                }
            }
        }

        if (musicToggle) {
            musicToggle.addEventListener('click', toggleAudio);
        }

        // Intento de reproducción al primer toque/clic en cualquier parte de la página
        const startAudioOnFirstInteraction = () => {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    updateAudioUI(true);
                }).catch(() => {});
            }
            window.removeEventListener('click', startAudioOnFirstInteraction);
            window.removeEventListener('touchstart', startAudioOnFirstInteraction);
        };

        window.addEventListener('click', startAudioOnFirstInteraction, { once: true });
        window.addEventListener('touchstart', startAudioOnFirstInteraction, { once: true });
    </script>
